name: cutting-report

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  image: cutting-report:local
  restart: unless-stopped
  init: true
  env_file:
    - .env
  environment: &app-environment
    APP_ENV: production
    APP_HOST: 0.0.0.0
    APP_PORT: 8000
    PYTHONPATH: /app/backend
    TZ: ${APP_TIMEZONE:-Asia/Shanghai}
    CONSUMER_REPLICAS: ${CONSUMER_REPLICAS:-1}
    POSTGRES_USER: cutting_app
    # Elevated credentials are consumed only by initialization/migration tools.
    POSTGRES_BOOTSTRAP_PASSWORD: ""
    POSTGRES_APP_PASSWORD: ""
    POSTGRES_MIGRATOR_PASSWORD: ""
  volumes:
    - cutting_data:/app/data
    - cutting_reports:/app/reports
    - cutting_logs:/app/logs
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-cutting_report}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-}
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/postgres/10-roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U postgres -d "$${POSTGRES_DB}" &&
          psql -U postgres -d "$${POSTGRES_DB}" -Atqc
          "SELECT COUNT(*)=2 AND NOT bool_or(rolsuper OR rolcreatedb OR rolcreaterole) FROM pg_roles WHERE rolname IN ('cutting_migrator','cutting_app')"
          | grep -qx t
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    <<: *app-common
    container_name: cutting-report
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${DOCKER_PORT:-8088}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  scheduler:
    <<: *app-common
    container_name: cutting-report-scheduler
    command: ["python", "-m", "app.scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.scheduler", "--health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    <<: *app-common
    environment:
      <<: *app-environment
      CONSUMER_INSTANCE_ID: ""
    deploy:
      replicas: ${CONSUMER_REPLICAS:-1}
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  automation:
    <<: *app-common
    container_name: cutting-report-automation
    command: ["python", "-m", "app.automation_worker"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.automation_worker", "--health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  migrate:
    <<: *app-common
    profiles: [tools]
    restart: "no"
    environment:
      PYTHONPATH: /app/backend
      POSTGRES_HOST: postgres
      POSTGRES_USER: cutting_migrator
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-}
      POSTGRES_BOOTSTRAP_PASSWORD: ""
      POSTGRES_APP_PASSWORD: ""
      POSTGRES_MIGRATOR_PASSWORD: ""
    command: ["python", "scripts/manage_postgres.py", "status"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cutting_data:
  cutting_reports:
  cutting_logs:
  postgres_data:
