name: cutting-report

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cutting-report:local
    container_name: cutting-report
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      TASK_EXCEL_PATH: /app/input/TASK.xlsx
      TZ: ${APP_TIMEZONE:-Asia/Shanghai}
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${DOCKER_PORT:-8000}:8000"
    volumes:
      - cutting_data:/app/data
      - cutting_reports:/app/reports
      - cutting_logs:/app/logs
      - ./docker/input:/app/input:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  cutting_data:
  cutting_reports:
  cutting_logs:
