name: cutting-report

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  image: cutting-report:local
  restart: unless-stopped
  init: true
  env_file:
    - .env
  environment:
    APP_ENV: production
    APP_HOST: 0.0.0.0
    APP_PORT: 8000
    PYTHONPATH: /app/backend
    TZ: ${APP_TIMEZONE:-Asia/Shanghai}
  volumes:
    - cutting_data:/app/data
    - cutting_reports:/app/reports
    - cutting_logs:/app/logs
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  app:
    <<: *app-common
    container_name: cutting-report
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${DOCKER_PORT:-8088}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    <<: *app-common
    container_name: cutting-report-worker
    command: ["python", "-m", "app.worker"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  cutting_data:
  cutting_reports:
  cutting_logs:
