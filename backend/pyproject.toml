[project]
name = "cutting-report-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "tzdata>=2025.2",
    "httpx>=0.28,<1",
    "sqlglot==30.13.0",
    "playwright>=1.55,<2",
    "mysql-connector-python>=9.2,<10",
]

[project.optional-dependencies]
sqlserver = ["pyodbc>=5.2,<6"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7"]

[tool.uv]
package = false
required-version = "==0.13.6"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

