[project]
name = "cutting-report-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "tzdata>=2025.2",
    "httpx>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
    "sqlglot==30.13.0",
    "playwright>=1.55,<2",
    "pypdfium2>=5,<6",
    "pillow>=12,<14",
    "mysql-connector-python>=9.2,<10",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
]

[project.optional-dependencies]
sqlserver = ["pyodbc>=5.2,<6"]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.17.6",
]

[tool.uv]
package = false
required-version = "==0.13.6"

[tool.ruff]
include = ["app/**/*.py", "app/**/*.pyi"]

[tool.ruff.lint]
select = ["E722", "BLE001", "S110", "S112", "SIM"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
# Keep this gate focused on the checks below without adopting the default rule set.
typeCheckingMode = "off"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error"

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
addopts = "-q"

